# Linux X64 and macOS ARM64 share the same build, package, and release pipeline.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: ${{ matrix.platform }} (${{ matrix.mlcomp }})
    permissions:
      contents: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            os: linux
            mlcomp: mlkit
            seed_version: v4.7.22
          - platform: linux-x64
            runner: ubuntu-24.04
            os: linux
            mlcomp: mlton
            seed_version: v4.7.22
          - platform: macos-arm64
            # The native v4.7.23 seed requires macOS 26.0 or newer.
            runner: macos-26
            os: darwin
            mlcomp: mlkit
            seed_version: v4.7.23
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      OS: ${{ matrix.os }}
      MLCOMP_HOST: ${{ matrix.mlcomp }}
      SEED_VERSION: ${{ matrix.seed_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up build directories
        run: |
          ci_root="$RUNNER_TEMP/mlkit-$OS-$MLCOMP_HOST"
          mkdir -p "$ci_root/logs" "$ci_root/tmp" "$ci_root/seed"
          echo "CI_ROOT=$ci_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$ci_root/tmp" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y gcc autoconf make binutils
          echo "THECC=gcc" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          wget -q https://github.com/melsman/phantomjs-bin/raw/refs/heads/main/phantomjs-2.1.1-linux-x86_64.tar.bz2
          tar xjf phantomjs-2.1.1-linux-x86_64.tar.bz2
          echo "$RUNNER_TEMP/phantomjs-2.1.1-linux-x86_64/bin" >> "$GITHUB_PATH"
          wget -q https://github.com/diku-dk/smlpkg/releases/download/v0.1.4/smlpkg-bin-dist-linux.tgz
          tar xzf smlpkg-bin-dist-linux.tgz
          echo "$RUNNER_TEMP/smlpkg-bin-dist-linux/bin" >> "$GITHUB_PATH"

      - name: Install macOS dependencies
        if: matrix.os == 'darwin'
        run: |
          test "$(uname -m)" = arm64
          brew install autoconf
          echo "THECC=/usr/bin/gcc" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-path

      - name: Install MLton
        if: matrix.mlcomp == 'mlton'
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230-1.amd64-linux.ubuntu-24.04_static.tgz
          tar xzf mlton-20241230-1.amd64-linux.ubuntu-24.04_static.tgz
          echo "$RUNNER_TEMP/mlton-20241230-1.amd64-linux.ubuntu-24.04_static/bin" >> "$GITHUB_PATH"

      - name: Install released MLKit seed
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/melsman/mlkit/releases/download/$SEED_VERSION/mlkit-bin-dist-$OS.tgz" \
            -o "$CI_ROOT/seed.tgz"
          tar -xzf "$CI_ROOT/seed.tgz" -C "$CI_ROOT/seed"
          seed="$CI_ROOT/seed/mlkit-bin-dist-$OS"
          echo "$seed/bin" >> "$GITHUB_PATH"
          echo "MLKIT_BOOTSTRAP_SML_LIB=$seed/lib/mlkit" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.mlkit"
          echo "SML_LIB $seed/lib/mlkit" > "$HOME/.mlkit/mlb-path-map"
          if [ "$OS" = darwin ]; then
            test "$(lipo -archs "$seed/bin/mlkit")" = arm64
          fi
          SML_LIB="$seed/lib/mlkit" "$seed/bin/mlkit" --version

      - name: Configure
        run: |
          exec > >(tee "$CI_ROOT/logs/configure.log") 2>&1
          ./autobuild
          "$THECC" --version
          if [ "$MLCOMP_HOST" = mlton ]; then
            mlton
            ./configure CC="$THECC" --with-compiler='mlton @MLton ram-slop 0.7 -- -drop-pass deepFlatten -drop-pass refFlatten -verbose 2'
          else
            ./configure CC="$THECC" --with-compiler=mlkit
          fi

      - name: Build MLKit, ReML, tools, and Basis libraries
        timeout-minutes: 240
        run: |
          exec > >(tee "$CI_ROOT/logs/build.log") 2>&1
          make mlkit_basislibs VERBOSE=1
          if [ "$OS" = darwin ]; then
            # The normal Makefile bootstraps with the native release and a
            # 512 MiB stack, then publishes the native tools under bin/.
            test ! -e lib/runtimeSystemGC.a
            test ! -d lib/darwin-x86_64
            test "$(lipo -archs bin/mlkit-arm64)" = arm64
            test "$(otool -l bin/mlkit-arm64 | awk '$1 == "stacksize" {print $2}')" = 536870912
            for tool in mlkit reml kittester mlkit-mllex mlkit-mlyacc rp2ps; do
              test "$(lipo -archs "bin/$tool")" = arm64
            done
            for runtime in lib/darwin-arm64/runtimeSystem*.a; do
              test "$(lipo -archs "$runtime")" = arm64
            done
            SML_LIB="$PWD" bin/mlkit --mlb-subdir Native \
              -o bin/arm64-emitter-test src/Compiler/Backend/Arm64/tests/emitter.mlb
          fi

      - name: Install MLKit
        run: sudo make install

      - name: Run compiler and runtime regression tests
        run: |
          exec > >(tee "$CI_ROOT/logs/tests.log") 2>&1
          if [ "$OS" = darwin ]; then
            export SML_LIB="$PWD"
            export MLKIT_ARM64="$PWD/bin/mlkit" REML_ARM64="$PWD/bin/reml"
            export ARM64_EMITTER="$PWD/bin/arm64-emitter-test" KITTESTER="$PWD/bin/kittester"
            export ARM64_KEEP_TEST_OUTPUTS=1
            tests=src/Compiler/Backend/Arm64/tests
            sh "$tests/check-native.sh"
            sh "$tests/check-parallel.sh"
            sh "$tests/check-regressions.sh"
          else
            make -C test_dev test
            make -C test_dev test_prof
            make -C test test_mlkit
            make -C test test_mlkit_no_gc
            make -C test/explicit_regions all
            make -C test/repl all
            make -C test/repl test_gc CC="$THECC"
            make -C test/parallelism all
            make -C test/region_info all
          fi

      - name: Build and install SMLtoJs
        run: |
          exec > >(tee "$CI_ROOT/logs/smltojs.log") 2>&1
          if [ "$MLCOMP_HOST" = mlton ]; then
            ./configure CC="$THECC" --with-compiler="SML_LIB=$PWD $PWD/bin/mlkit"
          fi
          make smltojs_basislibs
          sudo make install_smltojs

      - name: Run JavaScript and Barry tests
        if: matrix.os == 'linux'
        run: |
          exec > >(tee "$CI_ROOT/logs/js-barry.log") 2>&1
          export OPENSSL_CONF=/dev/null
          make -C js/test test
          make barry
          make -C test/barry all

      - name: Test bootstrap fixed point
        run: |
          exec > >(tee "$CI_ROOT/logs/bootstrap.log") 2>&1
          if [ "$OS" = darwin ]; then
            SML_LIB="$PWD" BOOTSTRAP_COMPILER="$PWD/bin/mlkit" \
              sh src/Compiler/Backend/Arm64/tests/check-bootstrap.sh
          else
            make bootstrap
          fi

      - name: Test native installation across runtime modes
        if: matrix.os == 'darwin'
        run: |
          exec > >(tee "$CI_ROOT/logs/install.log") 2>&1
          SML_LIB="$PWD" ARM64_NATIVE_BIN="$PWD/bin" ARM64_PREFIX="$CI_ROOT/install" \
            sh src/Compiler/Backend/Arm64/tests/install-native.sh

      - name: Build binary distribution
        run: |
          exec > >(tee "$CI_ROOT/logs/package-build.log") 2>&1
          make mlkit_bin_dist

      - name: Install and test the release archive
        run: |
          exec > >(tee "$CI_ROOT/logs/package.log") 2>&1
          root=$(pwd)
          package_name=mlkit-bin-dist-$OS
          archive=$PWD/dist/$package_name.tgz
          scratch=$(mktemp -d "${TMPDIR:-/tmp}/mlkit-package.XXXXXX")
          echo "Package check outputs: $scratch"

          # Reject the former flat archive before extracting or installing anything.
          tar -tzf "$archive" > "$scratch/contents.txt"
          awk -v root="$package_name" '
            $0 != root && index($0, root "/") != 1 { bad = 1 }
            END { exit (NR == 0 || bad) }
          ' "$scratch/contents.txt" || {
            echo "Expected one top-level $package_name/ directory" >&2
            exit 1
          }
          tar -xzf "$archive" -C "$scratch"
          package=$scratch/$package_name
          test -f "$package/Makefile"
          if [ "$OS" = darwin ]; then
            basis_cache=ARM64_FD2_RI_GC
          else
            basis_cache=RI_GC
          fi
          test -s "$package/lib/mlkit/basis/MLB/$basis_cache/repl.sml.d"
          check_arch() {
            if [ "$OS" = darwin ]; then
              test "$(lipo -archs "$1")" = arm64
            else
              readelf -h "$1" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
            fi
          }

          installed=$scratch/installed
          make -C "$package" install PREFIX="$installed"
          for tool in mlkit reml smltojs kittester mlkit-mllex mlkit-mlyacc rp2ps; do
            check_arch "$installed/bin/$tool"
          done
          if [ "$OS" = darwin ]; then
            for runtime in "$installed/lib/mlkit/lib/darwin-arm64/"runtimeSystem*.a; do
              check_arch "$runtime"
            done
          fi
          export SML_LIB=$installed/lib/mlkit
          export MLKIT=$installed/bin/mlkit
          "$MLKIT" --version
          "$installed/bin/reml" --version
          SML_LIB="$installed/lib/smltojs" "$installed/bin/smltojs" --version

          # A normal installation may be read-only to its users. It must not need to
          # recreate the Basis caches that were tested before packaging.
          chmod -R a-w "$installed/lib"
          mkdir "$scratch/user"
          cd "$scratch/user"
          cat > probe.sml <<'SML'
          val answer = List.foldl op+ 0 (List.tabulate (7, fn i => i + 3))
          val () = if answer = 42 then print "packaged compiler passed\n"
                   else raise Fail "incorrect result"
          SML
          printf 'packaged compiler passed\n' > expected
          for mode in gc no_gc; do
            "$MLKIT" "-$mode" -o "probe-$mode" probe.sml
            check_arch "probe-$mode"
            "./probe-$mode" > actual
            cmp expected actual
          done
          SML_LIB="$installed/lib/smltojs" "$installed/bin/smltojs" -o probe-js probe.sml
          test -s probe-js.html
          sh "$root/test/repl/check-installed.sh"
          echo "$OS release archive passed"

      - name: Stage logs without following test symlinks
        if: always()
        run: |
          python3 - <<'PYLOG'
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["CI_ROOT"])
          destination = root / "reports"
          suffixes = {".log", ".html", ".res", ".mlbres", ".out", ".err"}
          names = {"TESTmessages", "complog.txt"}
          workspace = Path.cwd()
          directories = [(root / "logs", root), (root / "tmp", root)]
          directories += [(workspace / name, workspace) for name in ("test", "test_dev", "js/test")]
          for directory, base in directories:
              for current, dirs, files in os.walk(directory, followlinks=False):
                  dirs[:] = [name for name in dirs if not (Path(current) / name).is_symlink()]
                  for name in files:
                      source = Path(current) / name
                      if source.is_symlink() or not source.is_file():
                          continue
                      if directory.name != "logs" and source.suffix not in suffixes and name not in names:
                          continue
                      target = destination / source.relative_to(base)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)
          config = Path("config.log")
          if config.is_file():
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(config, destination / config.name)
          PYLOG

      - name: Retain logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.mlcomp }}
          path: ${{ env.CI_ROOT }}/reports/
          retention-days: 14

      - name: Retain binary distribution
        uses: actions/upload-artifact@v4
        with:
          name: mlkit-bin-dist-${{ matrix.platform }}-${{ matrix.mlcomp }}
          path: dist/mlkit-bin-dist-${{ env.OS }}.tgz
          if-no-files-found: error

      - name: Upload release
        if: ${{ matrix.mlcomp == 'mlkit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/mlkit-bin-dist-${{ env.OS }}.tgz
          tag: ${{ github.ref }}
          overwrite: true
