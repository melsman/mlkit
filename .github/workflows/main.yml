# Linux X64 and macOS ARM64 share the same build, package, and release pipeline.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new PR revision supersedes every matrix job from its previous run.
# Other events use a unique run ID so releases and master builds finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-deploy:
    name: ${{ matrix.platform }} (${{ matrix.mlcomp }})
    permissions:
      contents: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            os: linux
            mlcomp: mlkit
            seed_version: v4.7.22
          - platform: linux-x64
            runner: ubuntu-24.04
            os: linux
            mlcomp: mlton
            seed_version: v4.7.22
          - platform: macos-arm64
            # The native v4.7.23 seed requires macOS 26.0 or newer.
            runner: macos-26
            os: darwin
            mlcomp: mlkit
            seed_version: v4.7.23
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      OS: ${{ matrix.os }}
      MLCOMP_HOST: ${{ matrix.mlcomp }}
      SEED_VERSION: ${{ matrix.seed_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y gcc autoconf make binutils time

      - name: Install Linux tools
        if: matrix.os == 'linux'
        run: |
          echo "THECC=gcc" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          wget -q https://github.com/melsman/phantomjs-bin/raw/refs/heads/main/phantomjs-2.1.1-linux-x86_64.tar.bz2
          tar xjf phantomjs-2.1.1-linux-x86_64.tar.bz2
          echo "$RUNNER_TEMP/phantomjs-2.1.1-linux-x86_64/bin" >> "$GITHUB_PATH"
          wget -q https://github.com/diku-dk/smlpkg/releases/download/v0.1.4/smlpkg-bin-dist-linux.tgz
          tar xzf smlpkg-bin-dist-linux.tgz
          echo "$RUNNER_TEMP/smlpkg-bin-dist-linux/bin" >> "$GITHUB_PATH"

      - name: Install macOS dependencies
        if: matrix.os == 'darwin'
        run: |
          brew install autoconf
          echo "THECC=/usr/bin/gcc" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-path

      - name: Install MLton
        if: matrix.mlcomp == 'mlton'
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230-1.amd64-linux.ubuntu-24.04_static.tgz
          tar xzf mlton-20241230-1.amd64-linux.ubuntu-24.04_static.tgz
          echo "$RUNNER_TEMP/mlton-20241230-1.amd64-linux.ubuntu-24.04_static/bin" >> "$GITHUB_PATH"

      - name: Install released MLKit seed
        run: |
          mkdir -p "$RUNNER_TEMP/seed"
          curl --fail --location --retry 3 \
            "https://github.com/melsman/mlkit/releases/download/$SEED_VERSION/mlkit-bin-dist-$OS.tgz" \
            -o "$RUNNER_TEMP/seed.tgz"
          tar -xzf "$RUNNER_TEMP/seed.tgz" -C "$RUNNER_TEMP/seed"
          seed="$RUNNER_TEMP/seed/mlkit-bin-dist-$OS"
          echo "$seed/bin" >> "$GITHUB_PATH"
          echo "SEED_LIB=$seed/lib/mlkit" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.mlkit"
          echo "SML_LIB $seed/lib/mlkit" > "$HOME/.mlkit/mlb-path-map"
          SML_LIB="$seed/lib/mlkit" "$seed/bin/mlkit" --version

      - name: Configure
        run: |
          ./autobuild
          "$THECC" --version
          compiler_jobs=$(getconf _NPROCESSORS_ONLN)
          echo "COMPILER_JOBS=$compiler_jobs" >> "$GITHUB_ENV"
          if [ "$MLCOMP_HOST" = mlton ]; then
            mlton
            ./configure CC="$THECC" --with-compiler='mlton @MLton ram-slop 0.7 -- -drop-pass deepFlatten -drop-pass refFlatten -verbose 2'
          else
            ./configure CC="$THECC" --with-compiler="mlkit -j $compiler_jobs" --with-compiler-lib="$SEED_LIB"
          fi

      - name: Check configured build and bootstrap targets
        run: make check-build

      - name: Build MLKit, ReML, tools, and Basis libraries
        timeout-minutes: 240
        run: |
          # Each Basis variant already uses two compiler workers. Limit the
          # concurrent variants on the 7 GiB ARM64 runner to reduce memory pressure.
          basis_jobs=6
          if [ "$OS" = darwin ]; then basis_jobs=2; fi
          make -j"$basis_jobs" mlkit_basislibs VERBOSE=1

      - name: Check pretty-printer spans and region profiler
        run: make check-profiling

      - name: Install MLKit
        run: sudo make install

      - name: Run compiler and runtime regression tests
        run: make check-compiler CC="$THECC"

      - name: Check explicit storage modes
        run: make -C test/explicit_regions test_storage_modes

      - name: Build SMLtoJs
        run: |
          if [ "$MLCOMP_HOST" = mlton ]; then
            ./configure CC="$THECC" --with-compiler="SML_LIB=$PWD $PWD/bin/mlkit -j $COMPILER_JOBS"
          fi
          make smltojs_basislibs

      - name: Install SMLtoJs
        run: sudo make install_smltojs

      - name: Run JavaScript and Barry tests
        if: matrix.os == 'linux'
        run: |
          export OPENSSL_CONF=/dev/null
          make -C js/test test
          make barry
          make -C test/barry all

      - name: Test bootstrap fixed point
        run: |
          output=$(mktemp -d "${TMPDIR:-/tmp}/mlkit-bootstrap.XXXXXX")
          jobs=$(getconf _NPROCESSORS_ONLN)
          echo "Bootstrap outputs: $output"
          echo "Runner: $(uname -sm); bootstrap workers: $jobs"
          if [ "$OS" = darwin ]; then
            sysctl hw.memsize vm.swapusage
          else
            head -n 3 /proc/meminfo
          fi
          status=0
          make bootstrap-compare BOOTSTRAP_DIR="$output" BOOTSTRAP_JOBS="$jobs" || status=$?
          {
            echo '## Bootstrap resource usage'
            echo "Runner: $(uname -sm); compiler workers: $jobs"
            echo 'CPU times include waited-for children. Peak RSS is not the sum of concurrent workers.'
            echo 'RSS units: bytes on macOS, KiB on Linux. Page faults can include file-backed pages.'
            for report in "$output"/stage*.resources; do
              [ -f "$report" ] || continue
              echo "### $(basename "$report" .resources)"
              echo '```text'
              cat "$report"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build binary distribution
        run: make mlkit_bin_dist

      - name: Test release installation across runtime modes
        run: |
          root=$(pwd)
          package_name=mlkit-bin-dist-$OS
          archive=$PWD/dist/$package_name.tgz
          scratch=$(mktemp -d "${TMPDIR:-/tmp}/mlkit-package.XXXXXX")
          echo "Package check outputs: $scratch"

          tar -xzf "$archive" -C "$scratch"
          package=$scratch/$package_name
          if [ "$OS" = darwin ]; then
            basis_cache=ARM64_RI_GC
          else
            basis_cache=RI_GC
          fi
          test -s "$package/lib/mlkit/basis/MLB/$basis_cache/repl.sml.d"
          installed=$scratch/installed
          make -C "$package" install PREFIX="$installed"
          if [ "$OS" = darwin ]; then
            test "$(lipo -archs "$installed/bin/mlkit")" = arm64
          else
            readelf -h "$installed/bin/mlkit" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          fi
          export SML_LIB=$installed/lib/mlkit
          export MLKIT=$installed/bin/mlkit
          "$MLKIT" --version
          "$installed/bin/reml" --version
          SML_LIB="$installed/lib/smltojs" "$installed/bin/smltojs" --version

          # A normal installation may be read-only to its users. It must not need to
          # recreate the Basis caches that were tested before packaging.
          chmod -R a-w "$installed/lib"
          mkdir "$scratch/user"
          cd "$scratch/user"
          cat > probe.sml <<'SML'
          val answer = List.foldl op+ 0 (List.tabulate (7, fn i => i + 3))
          val () = if answer = 42 then print "packaged compiler passed\n"
                   else raise Fail "incorrect result"
          SML
          SML_LIB="$installed/lib/smltojs" "$installed/bin/smltojs" -o probe-js probe.sml
          test -s probe-js.html
          sh "$root/test/repl/check-installed.sh"
          echo "$OS release archive passed"

      - name: Retain binary distribution
        uses: actions/upload-artifact@v7
        with:
          name: mlkit-bin-dist-${{ matrix.platform }}-${{ matrix.mlcomp }}
          path: dist/mlkit-bin-dist-${{ env.OS }}.tgz
          if-no-files-found: error

      - name: Upload release
        if: ${{ matrix.mlcomp == 'mlkit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/mlkit-bin-dist-${{ env.OS }}.tgz
          tag: ${{ github.ref }}
          overwrite: true
